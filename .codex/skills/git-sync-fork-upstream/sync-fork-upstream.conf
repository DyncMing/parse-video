# Project defaults for git-sync-fork-upstream.
# Edit this file when this skill is copied to another fork repository.
#
# Supported keys:
# originUrl, upstreamUrl, mode, syncMode, targetBranch, upstreamBranch,
# branchMapFile, validateCommand, validateScriptFile
#
# This file cannot enable execute, push, skipValidation, or confirmAllBranches.
# Those write-operation flags must be passed explicitly on the command line.

originUrl=https://github.com/DyncMing/parse-video.git
upstreamUrl=https://github.com/wujunwei928/parse-video.git
mode=all-branches

# Used only when mode=single-branch. Leave empty to use the current branch and same upstream branch.
targetBranch=
upstreamBranch=

# Set this only when all-branches mode needs different branch names.
branchMapFile=

# Replace with the project's real simple build/test command before using -Execute/-Push.
validateCommand=

# Prefer validateScriptFile for multi-step validation or commands that use shell variables.
validateScriptFile=
